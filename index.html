<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Ivrit — Hebrew Vocabulary Trainer</title>
<link rel="stylesheet" href="styles.css" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0f1220" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ivrit" />
</head>
<body>
<header class="topbar">
  <div class="brand" id="homeBtn">עברית · <span>Ivrit</span></div>
  <button class="hamburger" id="hamburger" aria-label="Menu" aria-expanded="false">☰</button>
  <div class="menu" id="menu">
    <nav class="tabs">
      <button data-view="lesson" class="active">Lesson</button>
      <button data-view="learn">Flashcards</button>
      <button data-view="sentences">Sentences</button>
      <button data-view="grammar">Grammar</button>
      <button data-view="browse">Browse</button>
      <button data-view="patterns">Patterns</button>
      <button data-view="import">Import</button>
    </nav>
    <div class="settings">
      <label class="chk"><input type="checkbox" id="tNikkud" checked> Nikkud</label>
      <label class="chk"><input type="checkbox" id="tTranslit" checked> Translit</label>
      <label class="chk"><input type="checkbox" id="tEnglish" checked> English</label>
      <select id="voiceSelect" title="Speech voice"></select>
    </div>
  </div>
</header>

<main id="app"></main>

<div id="toast" class="toast"></div>
<script src="data/vocab.js"></script>
<script src="app.js"></script>
<script src="sentences.js"></script>
<script src="grammar.js"></script>
<script>
  // PWA: register the offline service worker only when served over http/https (never file://).
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
