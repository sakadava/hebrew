<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar"><div class="brand" id="homeBtn">x</div><nav class="tabs"><button data-view="lesson" class="active"></button><button data-view="learn"></button><button data-view="sentences"></button><button data-view="browse"></button><button data-view="patterns"></button><button data-view="import"></button></nav><div class="settings"><label class="chk"><input type="checkbox" id="tNikkud" checked></label><label class="chk"><input type="checkbox" id="tTranslit" checked></label><label class="chk"><input type="checkbox" id="tEnglish" checked></label><select id="voiceSelect"></select></div></header>
<main id="app"></main><div id="toast" class="toast"></div><pre id="R"></pre>
<script src="data/vocab.js"></script><script src="app.js"></script><script src="sentences.js"></script>
<script>
function check(unit){
  lessonUnit=unit; renderLesson();
  const out=[];
  document.querySelectorAll('#lessonMasonry .masonry-item').forEach(card=>{
    card.querySelectorAll('table,.heb').forEach(el=>{
      if(el.scrollWidth > el.clientWidth+1){
        const en=(card.querySelector('.le-en')||{}).textContent||'?';
        out.push('u'+unit+' OVERFLOW '+en.trim()+' ['+el.className+'] '+el.scrollWidth+'>'+el.clientWidth);
      }
    });
  });
  return out;
}
setTimeout(()=>{
  let all=[];
  [1,5,8,15,16,30].forEach(u=>{ all=all.concat(check(u)); });
  document.getElementById('R').textContent = all.length? all.slice(0,30).join('\n') : 'NO OVERFLOW across units 1,5,8,15,16,30';
},300);
</script></body></html>
